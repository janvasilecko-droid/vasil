name: Unity core tests

on:
  push:
    paths:
      - "unity/**"
      - ".github/workflows/unity-core.yml"
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Testy jádra (bez Unity)
        working-directory: unity/CoreTests
        run: |
          set +e
          dotnet run -c Release > out.txt 2>&1
          code=$?
          # výsledek jde do anotace (čte se přes API, protože logy se z prostředí Claude stáhnout nedají)
          { grep -E "FAIL|error|Error|Unhandled|celkem" out.txt | head -c 6000; echo; tail -n 5 out.txt; } > summary.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' summary.txt)
          if [ $code -eq 0 ]; then echo "::notice title=core-tests::$msg"; else echo "::error title=core-tests::$msg"; fi
          cat out.txt
          exit $code

  param-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit registru parametrů + kalibrační dokumentace (musí být aktuální)
        run: |
          set +e
          python3 unity/Tools/audit_params.py > audit.txt 2>&1; a=$?
          python3 unity/Tools/gen_calib_doc.py >> audit.txt 2>&1; b=$?
          git diff --stat -- unity/docs >> audit.txt
          git diff --quiet -- unity/docs; c=$?
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' audit.txt)
          if [ $a -eq 0 ] && [ $b -eq 0 ] && [ $c -eq 0 ]; then echo "::notice title=param-audit::$msg"; else echo "::error title=param-audit::registr=$a generator=$b dokumentace-aktualni=$c $msg"; fi
          cat audit.txt
          exit $((a+b+c))

  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Původní testy z Godotu (přeložené do C#)
        working-directory: unity/CoreTests
        run: |
          set +e
          dotnet run -c Release -- --gdtests ../GodotSrc > gd.txt 2>&1
          code=$?
          { grep -E "FAIL|rror|Unhandled|výjimka|celkem|   at |   S_|AUDIT|REF |ZADÁNÍ|REGRESE" gd.txt | head -c 30000; echo; tail -n 5 gd.txt; } > gdsum.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' gdsum.txt)
          if [ $code -eq 0 ]; then echo "::notice title=gd-tests::$msg"; else echo "::error title=gd-tests::$msg"; fi
          # GitHub zkracuje anotace na ~4 kB → neúspěšné testy a nové regresní testy zvlášť
          { grep -E "FAIL|Unhandled|výjimka|   at |   S_|rror" gd.txt | head -c 3500; echo; tail -n 3 gd.txt; } > gdfail.txt
          m2=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' gdfail.txt)
          echo "::warning title=gd-fail::$m2"
          grep -E "REGRESE (kotel|registr|tabulka|přestup|potrubí|ledovka|lože)|KALIBRACE (vazba|skPerm|staré)" gd.txt | cut -c1-330 | head -c 3500 > gdreg1.txt
          m3=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' gdreg1.txt)
          echo "::warning title=gd-reg1::$m3"
          grep -E "REGRESE (chladič|rmutování|kvašení|CIP|extrémní)" gd.txt | cut -c1-330 | head -c 3500 > gdreg2.txt
          m4=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' gdreg2.txt)
          echo "::warning title=gd-reg2::$m4"
          cat gd.txt
          exit $code

  godot-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Spuštění přeložené aplikace bez okna (rychlá kontrola)
        working-directory: unity/CoreTests
        run: |
          set +e
          dotnet run -c Release -- --gdboot ../GodotSrc > boot.txt 2>&1
          code=$?
          { grep -E "CHYBA|celkem|kreslic|uzl|   at |      S_|      Pivovar|rror" boot.txt | head -c 7000; echo; tail -n 4 boot.txt; } > bootsum.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' bootsum.txt)
          if [ $code -eq 0 ]; then echo "::notice title=gd-boot::$msg"; else echo "::error title=gd-boot::$msg"; fi
          cat boot.txt
          exit $code

  godot-autobrew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Simulace celé várky (automat od vody po spilku)
        working-directory: unity/CoreTests
        run: |
          set +e
          dotnet run -c Release -- --gdauto ../GodotSrc > brew.txt 2>&1
          code=$?
          { grep -E "KONEC|PROTOKOL|BILANCE EXTRAKTU|vyteklo|CHYBA|Unhandled|výjimka|celkem|\[(warn|err|bad)" brew.txt | head -c 7000; echo; grep -E "^\[ *[0-9.]+ min\]" brew.txt | awk 'NR%2==1' | head -c 4000; } > brewsum.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' brewsum.txt)
          if [ $code -eq 0 ]; then echo "::notice title=autobrew::$msg"; else echo "::error title=autobrew::$msg"; fi
          cat brew.txt
          exit $code

  godot-userplan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Simulace celé várky na plánu uživatele (plan_upravy.json)
        working-directory: unity/CoreTests
        run: |
          set +e
          dotnet run -c Release -- --gdauto ../GodotSrc --userplan > ubrew.txt 2>&1
          code=$?
          { grep -E "KONEC|PROTOKOL|BILANCE EXTRAKTU|vyteklo|CHYBA|Unhandled|výjimka|celkem|roplach|FLUSH|\[(warn|err|bad)" ubrew.txt | head -c 7000; echo; grep -E "^\[ *[0-9.]+ min\]" ubrew.txt | awk 'NR%2==1' | head -c 4000; } > ubrewsum.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' ubrewsum.txt)
          if [ $code -eq 0 ]; then echo "::notice title=userplan::$msg"; else echo "::error title=userplan::$msg"; fi
          cat ubrew.txt
          exit $code

  compile-unity-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Překlad Unity skriptů proti UnityEngine.Modules
        working-directory: unity/CompileCheck
        run: |
          set +e
          dotnet build -c Release > out.txt 2>&1
          code=$?
          { grep -E "error|Build succeeded|Warn.*CS" out.txt | sort -u | head -c 6000; echo; tail -n 3 out.txt; } > summary.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' summary.txt)
          if [ $code -eq 0 ]; then echo "::notice title=unity-compile::$msg"; else echo "::error title=unity-compile::$msg"; fi
          cat out.txt
          exit $code

  # Aktualizace Unity programu bez nového stahování: po úspěšných testech se přeloží PivovarCore.dll a PivovarGdGen.dll
  # (stejné zdroje jako asmdef v Unity), spočítají se SHA-256 a vše se vystaví do větve unity-update (manifest.json + files/).
  update-pack:
    needs: [core, godot-tests, godot-boot, godot-autobrew, compile-unity-scripts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Přeložit knihovny pro aktualizaci
        run: |
          set +e
          dotnet build unity/UpdatePack/PivovarGdGen.csproj -c Release -o /tmp/pack > /tmp/pack.txt 2>&1
          code=$?
          ls -la /tmp/pack
          { grep -E "error|Build succeeded" /tmp/pack.txt | sort -u | head -c 3000; ls -la /tmp/pack | head -c 800; } > /tmp/packsum.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' /tmp/packsum.txt)
          if [ $code -eq 0 ]; then echo "::notice title=update-build::$msg"; else echo "::error title=update-build::$msg"; cat /tmp/pack.txt; fi
          exit $code
      - name: Manifest a publikace do větve unity-update
        run: |
          set -e
          python3 unity/Tools/make_update_manifest.py /tmp/upd /tmp/pack/PivovarCore.dll /tmp/pack/PivovarGdGen.dll "$GITHUB_SHA" 1 | tee /tmp/mf.txt
          cd /tmp/upd
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q -b unity-update
          git add -A
          git commit -q -m "Aktualizace Unity programu z $GITHUB_SHA"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q --force origin unity-update
          echo "::notice title=update-publish::$(cat /tmp/mf.txt)"
